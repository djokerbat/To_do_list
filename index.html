<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-video">
  <iframe
    src="https://www.youtube.com/embed/Zj3v9C3egW0?autoplay=1&mute=1&loop=1&playlist=Zj3v9C3egW0&controls=0&modestbranding=1&rel=0&playsinline=1"
    allow="autoplay; encrypted-media"
    title="Background video"
    frameborder="0"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
</div>

  <main class="app">
    <h1 class="title">To-Do List</h1>

    <form class="controls" id="todo-form">
      <input type="text" id="todo-input" autocomplete="off" aria-label="New task" />
      <input type="datetime-local" id="todo-date" aria-label="Due date and time" />
      <button type="submit" class="add-btn" aria-label="Add task">
        <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 4v16M4 12h16" />
        </svg>
      </button>

      <div class="select-wrap">
        <select id="filter" aria-label="Filter tasks">
          <option value="all">ALL</option>
          <option value="completed">Completed</option>
          <option value="uncompleted">Uncompleted</option>
        </select>
        <svg class="chevron" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 9l7 7 7-7" />
        </svg>
      </div>
    </form>

    <ul class="todo-list" id="todo-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
